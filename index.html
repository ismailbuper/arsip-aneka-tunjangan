<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aneka Tunjangan Guru Aceh</title>
  
  <!-- CSS Bootstrap & Styling Pendukung -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Library SheetJS untuk Membaca File Excel (.xlsx / .xls) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="card shadow p-4">
      <h2 class="mb-3">Unggah & Arsipkan Berkas Excel Baru</h2>
      <p class="text-muted">Pilih Periode Bulan, Gelombang, Golongan Jenis, dan Jenis Data untuk menyimpan data ke server.</p>
      
      <form id="formUpload">
        <div class="row mb-3">
          <div class="col-md-3">
            <label class="form-label">Pilih Bulan:</label>
            <select class="form-select" id="pilihBulan">
              <option value="">-- Pilih Bulan --</option>
              <option value="Januari">Januari</option>
              <option value="Februari">Februari</option>
              <option value="Maret">Maret</option>
              <option value="April">April</option>
              <option value="Mei">Mei</option>
              <option value="Juni">Juni</option>
              <option value="Juli">Juli</option>
              <option value="Agustus">Agustus</option>
              <option value="September">September</option>
              <option value="Oktober">Oktober</option>
              <option value="November">November</option>
              <option value="Desember">Desember</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label">Pilih Gelombang:</label>
            <select class="form-select" id="pilihGelombang">
              <option value="">-- Pilih Gelombang --</option>
              <option value="Gelombang 1">Gelombang 1</option>
              <option value="Gelombang 2">Gelombang 2</option>
              <option value="Gelombang 3">Gelombang 3</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label">Golongan Jenis:</label>
            <select class="form-select" id="pilihGolongan">
              <option value="">-- Pilih Golongan Jenis --</option>
              <option value="SMA, SMK, SLB, Pengawas">SMA, SMK, SLB, Pengawas</option>
              <option value="SD, SMP">SD, SMP</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label">Jenis Data Upload:</label>
            <select class="form-select" id="jenisData">
              <option value="">-- Pilih Jenis Data --</option>
              <option value="Tunjangan Profesi Guru">Tunjangan Profesi Guru</option>
              <option value="Tambahan Penghasilan">Tambahan Penghasilan</option>
              <option value="Tunjangan Khusus">Tunjangan Khusus</option>
            </select>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">File Excel (.xlsx / .xls):</label>
          <input type="file" class="form-control" id="fileExcel" accept=".xlsx, .xls">
        </div>

        <button type="submit" class="btn btn-primary" id="btnSimpan">Unggah & Simpan ke Arsip</button>
      </form>
    </div>
  </div>

  <!-- Skrip Integrasi Firebase & Logika Pembaca Excel -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Konfigurasi Firebase Anda
    const firebaseConfig = {
      apiKey: "AIzaSyDiauoeWbolZvc6oH_BGZDT6QwvVG5tcPo",
      authDomain: "tunjangan-guru-aceh.firebaseapp.com",
      databaseURL: "https://tunjangan-guru-aceh-default-rtdb.firebaseio.com",
      projectId: "tunjangan-guru-aceh",
      storageBucket: "tunjangan-guru-aceh.firebasestorage.app",
      messagingSenderId: "1050219017030",
      appId: "1:1050219017030:web:ec6c06bff49e231aa42b47",
      measurementId: "G-ZJQM52PZD9"
    };

    // Inisialisasi Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const inputfile = document.getElementById('fileExcel');
    const btnSimpan = document.getElementById('btnSimpan');
    let dataExcelParsed = null;

    // Fungsi pembersih karakter titik (.) atau simbol khusus agar aman di Firebase Key
    function bersihkanKeyFirebase(obj) {
      if (Array.isArray(obj)) {
        return obj.map(item => bersihkanKeyFirebase(item));
      } else if (obj !== null && typeof obj === 'object') {
        return Object.keys(obj).reduce((acc, key) => {
          const cleanKey = key.replace(/[.$#\[\]]/g, '_');
          acc[cleanKey] = bersihkanKeyFirebase(obj[key]);
          return acc;
        }, {});
      }
      return obj;
    }

    // Event saat file Excel dipilih
    inputfile.addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const data = new Uint8Array(event.target.result);
          const workbook = XLSX.read(data, { type: 'array' });

          // Ambil lembar kerja (sheet) pertama
          const sheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[sheetName];

          // Konversi isi Excel ke format JSON
          const rawJson = XLSX.utils.sheet_to_json(worksheet);
          
          // Bersihkan kuncinya
          dataExcelParsed = bersihkanKeyFirebase(rawJson);
          
          alert("Berhasil membaca file Excel! Ditemukan " + dataExcelParsed.length + " baris data.");
        } catch (error) {
          alert("Gagal memproses file Excel: " + error.message);
        }
      };
      reader.readAsArrayBuffer(file);
    });

    // Event saat tombol simpan diklik
    document.getElementById('formUpload').addEventListener("submit", function(e) {
      e.preventDefault();

      const bulan = document.getElementById('pilihBulan').value;
      const gelombang = document.getElementById('pilihGelombang').value;
      const golongan = document.getElementById('pilihGolongan').value;
      const jenisData = document.getElementById('jenisData').value;

      if (!bulan || !gelombang || !golongan || !jenisData) {
        alert("Mohon lengkapi semua pilihan formulir di atas!");
        return;
      }

      if (!dataExcelParsed || dataExcelParsed.length === 0) {
        alert("Silakan pilih file Excel terlebih dahulu dan tunggu hingga terbaca!");
        return;
      }

      btnSimpan.disabled = true;
      btnSimpan.innerText = "Menyimpan ke Database...";

      const arsipRef = ref(db, 'arsip_tunjangan_guru');

      // Mengirim data baris per baris ke Firebase
      let selesai = 0;
      dataExcelParsed.forEach((row) => {
        const dataBaruRef = push(arsipRef);
        set(dataBaruRef, {
          periodeBulan: bulan,
          gelombang: gelombang,
          golonganJenis: golongan,
          jenisDataUpload: jenisData,
          detailData: row,
          waktuUpload: new Date().toLocaleString()
        }).then(() => {
          selesai++;
          if (selesai === dataExcelParsed.length) {
            alert("Semua data berhasil disimpan secara permanen ke server Firebase!");
            btnSimpan.disabled = false;
            btnSimpan.innerText = "Unggah & Simpan ke Arsip";
            document.getElementById('formUpload').reset();
            dataExcelParsed = null;
          }
        }).catch((err) => {
          console.error("Gagal menyimpan:", err);
          btnSimpan.disabled = false;
          btnSimpan.innerText = "Unggah & Simpan ke Arsip";
        });
      });
    });
  </script>
</body>
</html>
